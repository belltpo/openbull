[project]
name = "openbull"
version = "1.0.0"
description = "Options Trading Platform for Indian Brokers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # Starlette is a transitive dep via fastapi (which only requires
    # >=0.46.0). Pinned at the top level to force 1.3.1+, which fixes:
    #   CVE-2026-48710 unvalidated Host header -> path injection in request.url
    #   CVE-2026-54282 unvalidated request path -> request.url reconstruction
    #   CVE-2026-54283 max_fields/max_part_size ignored for urlencoded bodies
    #   CVE-2026-48817 HTTPEndpoint getattr dispatch on arbitrary method names
    #   CVE-2026-48818 StaticFiles UNC path traversal on Windows
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    # 2.14.2 fixes CVE-2026-58203 (symlink escape out of secrets_dir).
    "pydantic-settings>=2.14.2",
    # JWT: PyJWT, not python-jose. python-jose through 3.5.0 has an unfixed
    # advisory (CVE-2026-85394 / PYSEC-2026-4298: DER public keys accepted as
    # HMAC secrets -> HS256 forgery) with no upstream patch, and it drags in
    # ecdsa (CVE-2024-23342 Minerva, won't-fix upstream), rsa and pyasn1
    # (7 decoder-DoS advisories). PyJWT has none of that and the same
    # encode/decode surface. Tokens are wire-compatible: same HS256, same
    # secret, same claims — cookies issued before the swap stay valid.
    "pyjwt>=2.10.1",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    # 0.0.31 fixes CVE-2026-53540 (negative Content-Length turns the bounded
    # read into read-until-EOF), CVE-2026-53539 (quadratic separator scan)
    # and CVE-2026-53538 (`;` wrongly treated as a field separator). No
    # endpoint parses forms today, but a single Form()/UploadFile would make
    # all three live, so keep it current.
    "python-multipart>=0.0.31",
    # Mako is a transitive dep via alembic. Pinned at the top level to
    # force 1.3.12+ which patches CVE-2025 (path traversal via double-
    # slash / backslash URI prefix in TemplateLookup). We don't use
    # TemplateLookup but Dependabot flags any vulnerable version on the
    # tree, so bumping closes the alerts.
    "mako>=1.3.12",
    "python-dotenv>=1.0.1",
    "cachetools>=5.5.0",
    "pandas>=2.2.0",
    # opengreeks: Rust Black-76 (py_vollib-compatible signatures, NumPy-only dep)
    # powers option Greeks/IV. option_greeks_service falls back to a built-in
    # pure-math Black-76 if this is not installed, so it is effectively optional.
    "opengreeks>=0.1.0",
    "psycopg2-binary>=2.9.11",
    "psycopg[binary]>=3.3.3",
    "pyzmq>=27.1.0",
    "websockets>=16.0",
    "protobuf>=7.34.1",
    "websocket-client>=1.9.0",
    # tornado was pinned here but is imported nowhere in the codebase, and
    # uv.lock confirmed openbull was its only requirer. Dropping it removes
    # 13 advisories (incl. GHSA-c2m8-h5v5-343r StaticFileHandler arbitrary
    # file read and CVE-2026-116578 RedirectHandler open redirect) at zero
    # compatibility cost. Do not re-add it without a real import.
    "redis>=5.0",
    "limits[redis]>=3.0",
    "apscheduler>=3.10",
    # --- Transitive deps pinned at the top level to force patched versions.
    # certifi: GHSA-6q48-6c7w-9gw2 — the bundled store shipped the emSign ECC
    # Root CA G3, whose eMudhra intermediates have compromised private keys.
    # This one is genuinely live: it governs trust for every outbound broker
    # TLS call.
    "certifi>=2026.10.18",
    # anyio: CVE-2026-63374 (IDNA/TLS hostname handling) and CVE-2026-64847
    # (process-pool worker stderr pipe never drained).
    "anyio>=4.14.2",
    # dnspython (via pydantic[email] -> email-validator):
    # CVE-2026-114605 — CPU exhaustion in DNS name decompression.
    "dnspython>=2.9.0",
]

[dependency-groups]
# Test tooling. The suite is stdlib unittest (IsolatedAsyncioTestCase), so
# pytest is only the runner; pytest-asyncio is for the bare `async def`
# tests in test_redis_cache.py, which also need a live Redis.
#   uv sync --group dev && uv run pytest backend/test -q
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
# Silences PytestDeprecationWarning from pytest-asyncio. No async fixtures
# exist yet; pinning the scope now keeps the default from changing under us.
asyncio_default_fixture_loop_scope = "function"
