      .line-magenta { stroke: #a855f7; stroke-width: 3; stroke-dasharray: 7 6; }
      .card { rx: 8; filter: url(#shadow); }
      .label { fill: #ffffff; font-weight: 700; font-size: 22px; }
      .small { fill: #cbd5e1; font-size: 16px; }
      .green { fill: #24f59a; }
      .red { fill: #ff5c6c; }
      .orange { fill: #ffb347; }
      .badge { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 8; }
